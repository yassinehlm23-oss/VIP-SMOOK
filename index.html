<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shadow of the Glitch: Cyber Legacy (Global Edition)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010103;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    /* واجهة المعلومات العلوية الفاخرة HUD */
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 100;
    }
    .hud-glass {
      background: rgba(8, 12, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 16px;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #dim-badge {
      color: #00f0ff;
      border-color: rgba(0, 240, 255, 0.4);
      letter-spacing: 1px;
      transition: all 0.25s ease;
    }
    .badge-danger {
      color: #f43f5e !important;
      border-color: rgba(244, 63, 94, 0.4) !important;
    }

    /* أزرار التحكم اللمسية السينمائية */
    #touch-bar {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
      z-index: 110;
    }
    .cluster {
      display: flex;
      gap: 14px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(15, 20, 36, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255,255,255,0.15);
      transition: transform 0.08s cubic-bezier(0.1, 0.9, 0.2, 1), background 0.08s;
      touch-action: none;
    }
    .btn:active, .btn.pressed {
      transform: scale(0.88);
      background: rgba(255, 255, 255, 0.4);
    }
    .btn-shift {
      background: rgba(255, 0, 128, 0.25);
      border-color: #ff007f;
      color: #ff007f;
      font-size: 11px;
      font-weight: 900;
    }
    .btn-dash {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
      color: #f59e0b;
      font-size: 11px;
      font-weight: 900;
    }
    .btn-jump {
      background: rgba(0, 240, 255, 0.25);
      border-color: #00f0ff;
      color: #00f0ff;
    }

    /* شاشات البداية والفوز والرسائل */
    #menu-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(12, 16, 32, 0.96) 0%, rgba(2, 3, 6, 0.99) 100%);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 30px;
      text-align: center;
    }
    #menu-overlay.hidden { display: none !important; }
    #menu-overlay h1 {
      font-size: 32px;
      color: #00f0ff;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: 900;
    }
    #menu-overlay p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 440px;
      line-height: 1.8;
      margin-bottom: 32px;
      white-space: pre-line;
    }
    .rank-badge {
      display: inline-block;
      font-size: 54px;
      font-weight: 900;
      color: #f59e0b;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.8);
      margin-bottom: 12px;
    }
    .glow-btn {
      padding: 16px 54px;
      font-size: 18px;
      font-weight: 800;
      color: #010204;
      background: linear-gradient(135deg, #00f0ff, #0088ff);
      border: none;
      border-radius: 40px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.7);
      cursor: pointer;
    }
    .glow-btn:active { transform: scale(0.95); }
  </style>
</head>

    استخدم <b>SHIFT</b> للتبديل بين الأبعاد، <b>DASH</b> للاندفاع واختراق الحراس،
    والتصق بالجدران للقيام بـ <b>Wall Jump</b>.

<script>
// ==========================================
// 1. محرك الصوتيات الإجرائي (Procedural Synth Engine)
// ==========================================
let actx = null;
let bgmStep = 0;
let bgmInterval = null;

function bootAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx && actx.state === 'suspended') actx.resume();
  startBGM();
}

function fx(type) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.connect(g);
  g.connect(actx.destination);

  if (type === 'jump') {
    o.type = 'triangle';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(540, t + 0.12);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.start(t); o.stop(t + 0.12);
  } else if (type === 'walljump') {
    o.type = 'sine';
    o.frequency.setValueAtTime(260, t);
    o.frequency.exponentialRampToValueAtTime(680, t + 0.14);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.start(t); o.stop(t + 0.14);
  } else if (type === 'doublejump') {
    o.type = 'sine';
    o.frequency.setValueAtTime(350, t);
    o.frequency.exponentialRampToValueAtTime(800, t + 0.15);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.start(t); o.stop(t + 0.15);
  } else if (type === 'dash') {
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.start(t); o.stop(t + 0.18);
  } else if (type === 'shift') {
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(800, t);
    o.frequency.exponentialRampToValueAtTime(100, t + 0.22);
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.start(t); o.stop(t + 0.22);
  } else if (type === 'shard') {
    o.type = 'sine';
    o.frequency.setValueAtTime(659.25, t);
    o.frequency.setValueAtTime(987.77, t + 0.08);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.start(t); o.stop(t + 0.3);
  } else if (type === 'hit') {
    o.type = 'square';
    o.frequency.setValueAtTime(200, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.2);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.start(t); o.stop(t + 0.2);
  } else if (type === 'slowmo') {
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.25);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.start(t); o.stop(t + 0.25);
  } else if (type === 'death') {
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(20, t + 0.35);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.start(t); o.stop(t + 0.35);
  }
}

function startBGM() {
  if (bgmInterval || !actx) return;
  const baseNotes = [110, 110, 130.81, 98, 87.31, 98, 110, 146.83];
  bgmInterval = setInterval(() => {
    if (!sys.running || !actx) return;
    try {
      const t = actx.currentTime;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = (sys.dimension === 'REAL') ? 'sine' : 'sawtooth';
      const f = baseNotes[bgmStep % baseNotes.length];
      o.frequency.setValueAtTime(f, t);
      const vol = (sys.dimension === 'REAL') ? 0.03 : 0.02;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t);
      o.stop(t + 0.7);
      bgmStep++;
    } catch(e){}
  }, 400);
}

function haptic(ms = 25) {
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch(e){}
  }
}

// ==========================================
// 4. البطل، الشبح الملاحق، والفيزياء
// ==========================================
const hero = {
  x: 0, y: 0,
  w: 26, h: 38,
  vx: 0, vy: 0,
  speed: 5.6,
  jumpForce: -12.4,
  isGrounded: false,
  isWallSliding: false,
  wallDir: 0, // -1 يسار، 1 يمين
  jumps: 2,
  coyote: 0,
  buffer: 0,
  canDash: true,
  isDashing: false,
  dashTime: 0,
  dashDir: 1,
  facing: 1,
  scaleX: 1, scaleY: 1,
  scarf: [
    {x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}
  ],

};

// جدار الموت الرقمي الملاحق
const chaser = {
  x: -400,
  speed: 1.2
};

// نظام طيف الموت السابق (Death Echo)
let currentRunTrail = [];
let echoTrail = [];
let echoIndex = 0;

let fxParticles = [];
function addFx(x, y, color, count = 12, mul = 1) {
  for (let i = 0; i < count; i++) {
    fxParticles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6 * mul,
      vy: (Math.random() - 0.5) * 6 * mul,
      life: 1,
      decay: Math.random() * 0.035 + 0.025,
      color
    });
  }
}

// ==========================================
// 5. نظام الإدخال
// ==========================================
const keys = { left: false, right: false };

function bindTouch(id, onStart, onEnd) {
  const el = document.getElementById(id);
  const start = (e) => {
    e.preventDefault();
    bootAudio();
    el.classList.add('pressed');
    onStart();
  };
  const end = (e) => {
    e.preventDefault();
    el.classList.remove('pressed');
    if (onEnd) onEnd();
  };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}

bindTouch('t-left', () => keys.left = true, () => keys.left = false);
bindTouch('t-right', () => keys.right = true, () => keys.right = false);
bindTouch('t-jump', () => cmdJump(), null);
bindTouch('t-dash', () => cmdDash(), null);
bindTouch('t-shift', () => cmdShift(), null);

window.addEventListener('keydown', (e) => {
  bootAudio();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') cmdJump();
  if (e.code === 'KeyJ' || e.code === 'ShiftLeft') cmdDash();
  if (e.code === 'KeyK' || e.code === 'KeyE') cmdShift();
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

function cmdJump() {
  if (!sys.running) return;
  hero.buffer = 8;
}

function cmdDash() {
  if (!sys.running || !hero.canDash || hero.isDashing) return;
  hero.isDashing = true;
  hero.canDash = false;
  hero.dashTime = 12;
  hero.dashDir = hero.facing;
  hero.vy = 0;
  fx('dash');
  haptic(45);
  sys.shake = 10;
  sys.flash = 0.35; // وميض أبيض سينمائي
  hero.scaleX = 1.45;
  hero.scaleY = 0.65;
  addFx(hero.x + hero.w/2, hero.y + hero.h/2, '#f59e0b', 16);
}

function cmdShift() {
  if (!sys.running) return;
  sys.dimension = (sys.dimension === 'REAL') ? 'GLITCH' : 'REAL';
  sys.shake = 12;
  sys.chromatic = 14;
  fx('shift');
  haptic(35);

  const col = (sys.dimension === 'REAL') ? '#00f0ff' : '#ff007f';
  addFx(hero.x + hero.w/2, hero.y + hero.h/2, col, 24);

  const b = document.getElementById('dim-badge');
  if (sys.dimension === 'REAL') {
    b.innerText = '✦ الواقع [REALITY]';
    b.style.color = '#00f0ff';
    b.style.borderColor = 'rgba(0, 240, 255, 0.4)';
  } else {
    b.innerText = '✦ السايبر [GLITCH]';
    b.style.color = '#ff007f';
    b.style.borderColor = 'rgba(255, 0, 127, 0.4)';
  }
}

// ==========================================
// 6. المحرك الفيزيائي المتطور
// ==========================================
function startLevel(idx) {
  sys.level = idx;
  const lvl = levels[idx];
  hero.x = lvl.spawn.x;
  hero.y = lvl.spawn.y;
  hero.vx = 0;
  hero.vy = 0;
  hero.jumps = 2;
  hero.canDash = true;
  hero.ghosts = [];
  sys.dimension = 'REAL';
  sys.shards = 0;
  sys.totalShards = lvl.shards.length;
  lvl.shards.forEach(s => s.collected = false);
  if (lvl.enemies) lvl.enemies.forEach(e => e.alive = true);

  // إعداد الجدار الملاحق
  chaser.x = lvl.spawn.x - 360;
  chaser.speed = lvl.chaserSpeed || 1.2;

  // حفظ مسار الشبح وتفريغ الذاكرة المؤقتة
  echoTrail = [...currentRunTrail];
  currentRunTrail = [];
  echoIndex = 0;

  for (let i = 0; i < hero.scarf.length; i++) {
    hero.scarf[i].x = hero.x;
    hero.scarf[i].y = hero.y + 10;
  }

  cam.x = hero.x - W / 2;
  cam.y = hero.y - H / 2;

  document.getElementById('lvl-badge').innerText = `المستوى: ${idx + 1} / ${levels.length}`;
  const b = document.getElementById('dim-badge');
  b.innerText = '✦ الواقع [REALITY]';
  b.style.color = '#00f0ff';
  b.style.borderColor = 'rgba(0, 240, 255, 0.4)';
}

function killPlayer() {
  fx('death');
  haptic(70);
  sys.shake = 18;
  sys.chromatic = 22;
  sys.deaths++;
  addFx(hero.x + hero.w/2, hero.y + hero.h/2, '#ef4444', 35, 1.6);

  const lvl = levels[sys.level];

  // تحويل المسار الحالي لطيف موتى سابق
  echoTrail = [...currentRunTrail];
  currentRunTrail = [];
  echoIndex = 0;

  // إعادة فورية للبداية دون انقطاع
  hero.x = lvl.spawn.x;
  hero.y = lvl.spawn.y;
  hero.vx = 0;
  hero.vy = 0;
  hero.isDashing = false;
  hero.canDash = true;
  chaser.x = lvl.spawn.x - 360;
}

function updatePhysics() {
  const lvl = levels[sys.level];

  // إدارة التباطؤ الحرج (Bullet Time / SlowMo)
  if (sys.slowMoTimer > 0) {
    sys.slowMoTimer--;
    sys.timeScale = 0.5;
  } else {
    sys.timeScale = 1.0;
  }

  // تسجيل مسار اللاعب كل 3 إطارات للشبح
  if (Math.floor(performance.now() / 16) % 3 === 0) {
    currentRunTrail.push({ x: hero.x, y: hero.y, dim: sys.dimension });
  }

  // تحريك الجدار الملاحق المتسارع
  chaser.x += chaser.speed * sys.timeScale;
  if (hero.x < chaser.x) {
    killPlayer();
    return;
  }

  // تحريك المنصات
  if (lvl.moving) {
    lvl.moving.forEach(m => {
      m.x += (m.spd * m.dir) * sys.timeScale;
      if (m.x > m.maxX) { m.x = m.maxX; m.dir = -1; }
      if (m.x < m.minX) { m.x = m.minX; m.dir = 1; }
    });
  }

  // منطق الأعداء مع كشف الاقتراب الحرج (Near-Miss)
  if (lvl.enemies) {
    lvl.enemies.forEach(en => {
      if (!en.alive) return;
      en.x += (en.spd * en.dir) * sys.timeScale;
      if (en.x > en.maxX) { en.x = en.maxX; en.dir = -1; }
      if (en.x < en.minX) { en.x = en.minX; en.dir = 1; }

      // تصادم مباشر
      if (isOverlap(hero, en)) {
        if (hero.vy > 2 || hero.isDashing) {
          en.alive = false;
          fx('hit');
          haptic(40);
          sys.shake = 10;
          addFx(en.x + en.w/2, en.y + en.h/2, '#00f0ff', 22);
          hero.vy = -8.5;
          hero.canDash = true;
        } else {
          killPlayer();
        }
      } else {
        // ميكانيكا الهروب الحرج من العدو
        const dist = Math.hypot((hero.x + hero.w/2) - (en.x + en.w/2), (hero.y + hero.h/2) - (en.y + en.h/2));
        if (dist < 42 && sys.slowMoTimer <= 0) {
          sys.slowMoTimer = 14;
          fx('slowmo');
          haptic(15);
        }
      }
    });
  }

  // فيزياء الاندفاع Dash
  if (hero.isDashing) {
    hero.vx = hero.dashDir * 15 * sys.timeScale;
    hero.vy = 0;
    hero.dashTime--;
    hero.ghosts.push({ x: hero.x, y: hero.y, alpha: 0.7, color: '#f59e0b' });
    if (hero.dashTime <= 0) hero.isDashing = false;
  } else {
    // حركة أفقية
    if (keys.left) {
      hero.vx = -hero.speed * sys.timeScale;
      hero.facing = -1;
    } else if (keys.right) {
      hero.vx = hero.speed * sys.timeScale;
      hero.facing = 1;
    } else {
      hero.vx *= 0.72;
    }

    // تطبيق الجاذبية مع مراعاة الانزلاق على الجدران (Wall Sliding)
    if (hero.isWallSliding && hero.vy > 0) {
      hero.vy += 0.16 * sys.timeScale; // انزلاق بطيء
      if (hero.vy > 2.8) hero.vy = 2.8;
    } else {
      hero.vy += 0.58 * sys.timeScale;
      if (hero.vy > 13) hero.vy = 13;
    }
  }

  hero.scaleX += (1 - hero.scaleX) * 0.15;
  hero.scaleY += (1 - hero.scaleY) * 0.15;

  if (hero.isGrounded) {
    hero.coyote = 6;
    hero.jumps = 2;
    hero.canDash = true;
  } else {
    if (hero.coyote > 0) hero.coyote--;
  }

  // معالجة القفز وقفز الجدران المتقدم
  if (hero.buffer > 0) {
    if (hero.isWallSliding) {
      // Wall Jump
      hero.vy = hero.jumpForce * 0.94;
      hero.vx = -hero.wallDir * (hero.speed * 1.35);
      hero.facing = -hero.wallDir;
      hero.isWallSliding = false;
      hero.buffer = 0;
      hero.canDash = true;
      hero.scaleX = 0.75;
      hero.scaleY = 1.35;
      fx('walljump');
      addFx(hero.x + (hero.wallDir === 1 ? hero.w : 0), hero.y + hero.h/2, '#00f0ff', 12);
    } else if (hero.coyote > 0) {
      hero.vy = hero.jumpForce;
      hero.isGrounded = false;
      hero.coyote = 0;
      hero.buffer = 0;
      hero.scaleX = 0.75;
      hero.scaleY = 1.35;
      fx('jump');
      addFx(hero.x + hero.w/2, hero.y + hero.h, '#fff', 8);
    } else if (hero.jumps > 1) {
      hero.vy = hero.jumpForce * 0.94;
      hero.jumps--;
      hero.buffer = 0;
      hero.scaleX = 0.8;
      hero.scaleY = 1.3;
      fx('doublejump');
      addFx(hero.x + hero.w/2, hero.y + hero.h, '#00f0ff', 12);
    }
    hero.buffer--;
  }

  // تصادم المنصات الأفقي ورصد الجدران للانزلاق
  hero.x += hero.vx;
  const solids = [...lvl.platforms, ...(lvl.moving || [])];
  hero.isWallSliding = false;
  hero.wallDir = 0;

  solids.forEach(p => {
    if (p.d === 'BOTH' || p.d === sys.dimension) {
      if (isOverlap(hero, p)) {
        if (hero.vx > 0) {
          hero.x = p.x - hero.w;
          if (!hero.isGrounded && hero.vy > 0) {
            hero.isWallSliding = true;
            hero.wallDir = 1;
          }
        } else if (hero.vx < 0) {
          hero.x = p.x + p.w;
          if (!hero.isGrounded && hero.vy > 0) {
            hero.isWallSliding = true;
            hero.wallDir = -1;
          }
        }
        hero.vx = 0;
        hero.isDashing = false;
      }
    }
  });

  // الحركة والتصادم الرأسي
  hero.y += hero.vy;
  const wasGrounded = hero.isGrounded;
  hero.isGrounded = false;

  solids.forEach(p => {
    if (p.d === 'BOTH' || p.d === sys.dimension) {
      if (isOverlap(hero, p)) {
        if (hero.vy > 0) {
          hero.y = p.y - hero.h;
          hero.vy = 0;
          hero.isGrounded = true;
          if (!wasGrounded) {
            hero.scaleX = 1.3;
            hero.scaleY = 0.7;
          }
        } else if (hero.vy < 0) {
          hero.y = p.y + p.h;
          hero.vy = 0;
        }
      }
    }
  });

  // تحديث الوشاح الفيزيائي
  const neckX = hero.x + (hero.facing === 1 ? 6 : 20);
  const neckY = hero.y + 12;
  hero.scarf[0].x = neckX;
  hero.scarf[0].y = neckY;
  for (let i = 1; i < hero.scarf.length; i++) {
    const cur = hero.scarf[i];
    const prev = hero.scarf[i - 1];
    cur.x += (prev.x - cur.x) * 0.45 - (hero.facing * 1.5);
    cur.y += (prev.y - cur.y) * 0.45 + 0.8;
  }

  // فحص الأفخاخ والموت
  lvl.hazards.forEach(h => {
    if (h.d === 'BOTH' || h.d === sys.dimension) {
      if (isOverlap(hero, h)) killPlayer();
    }
  });
  if (hero.y > lvl.h + 80) killPlayer();

  // جمع الشظايا
  lvl.shards.forEach(s => {
    if (!s.collected && isOverlap(hero, { x: s.x - 16, y: s.y - 16, w: 32, h: 32 })) {
      s.collected = true;
      sys.shards++;
      fx('shard');
      haptic(25);
      addFx(s.x, s.y, '#fbbf24', 16);
    }
  });

  // مخرج المرحلة
  const ex = lvl.exit;
  if (isOverlap(hero, { x: ex.x, y: ex.y, w: 38, h: 62 })) {
    if (sys.shards >= sys.totalShards) {
      if (sys.level + 1 < levels.length) {
        startLevel(sys.level + 1);
      } else {
        winGame();
      }
    }
  }

  // تحديث الأشباح
  for (let i = hero.ghosts.length - 1; i >= 0; i--) {
    hero.ghosts[i].alpha -= 0.08;
    if (hero.ghosts[i].alpha <= 0) hero.ghosts.splice(i, 1);
  }

  // تحديث الكاميرا
  cam.targetX = hero.x - W / 2 + hero.w / 2;
  cam.targetY = hero.y - H / 2 + hero.h / 2;
  cam.x += (cam.targetX - cam.x) * cam.k;
  cam.y += (cam.targetY - cam.y) * cam.k;
  cam.x = Math.max(0, Math.min(cam.x, lvl.w - W));
  cam.y = Math.max(0, Math.min(cam.y, lvl.h - H));

  // تحديث الـ HUD
  const elapsed = performance.now() - sys.timeStart;
  const m = String(Math.floor(elapsed / 60000)).padStart(2, '0');
  const s = String(Math.floor((elapsed % 60000) / 1000)).padStart(2, '0');
  const ms = String(Math.floor((elapsed % 1000) / 10)).padStart(2, '0');
  document.getElementById('stats-badge').innerText = `💀 ${sys.deaths} | 💎 ${sys.shards}/${sys.totalShards} | ⏱️ ${m}:${s}.${ms}`;
}

function isOverlap(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

// ==========================================
// 7. محرك الرسم، الإضاءة، وشبح الموت السابق
// ==========================================
function render() {
  ctx.save();

  let sx = 0, sy = 0;
  if (sys.shake > 0) {
    sx = (Math.random() - 0.5) * sys.shake;
    sy = (Math.random() - 0.5) * sys.shake;
    sys.shake *= 0.86;
    if (sys.shake < 0.2) sys.shake = 0;
  }
  if (sys.chromatic > 0) sys.chromatic *= 0.85;

  ctx.translate(-cam.x + sx, -cam.y + sy);

  const lvl = levels[sys.level];

  // الخلفية
  if (sys.dimension === 'REAL') {
    ctx.fillStyle = '#06070d';
    ctx.fillRect(cam.x, cam.y, W, H);
    drawGrid('#0e1526', 64, lvl.w, lvl.h);
  } else {
    ctx.fillStyle = '#0c0312';
    ctx.fillRect(cam.x, cam.y, W, H);
    drawGrid('#2a0733', 64, lvl.w, lvl.h);
  }

  // رسم طيف المحاولة السابقة (Echo Ghost)
  if (echoTrail.length > 0 && echoIndex < echoTrail.length) {
    const e = echoTrail[echoIndex];
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(e.x, e.y, hero.w, hero.h);
    ctx.restore();
    echoIndex++;
  }

  // رسم جدار الليزر الملاحق (The Chaser Wall)
  ctx.save();
  const gradChaser = ctx.createLinearGradient(chaser.x - 120, 0, chaser.x, 0);
  gradChaser.addColorStop(0, 'rgba(239, 68, 68, 0.05)');
  gradChaser.addColorStop(1, 'rgba(239, 68, 68, 0.7)');
  ctx.fillStyle = gradChaser;
  ctx.fillRect(chaser.x - 120, 0, 120, lvl.h);

  ctx.strokeStyle = '#ef4444';
  ctx.shadowColor = '#f43f5e';
  ctx.shadowBlur = 24;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(chaser.x, 0);
  ctx.lineTo(chaser.x, lvl.h);
  ctx.stroke();
  ctx.restore();

  // رسم المنصات
  const solids = [...lvl.platforms, ...(lvl.moving || [])];
  solids.forEach(p => {
    const active = (p.d === 'BOTH' || p.d === sys.dimension);
    ctx.save();
    if (!active) {
      ctx.globalAlpha = 0.15;
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    } else {
      if (p.d === 'BOTH') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#334155';
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      } else if (p.d === 'REAL') {
        ctx.fillStyle = '#0284c7';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.fillRect(p.x, p.y, p.w, p.h);
      } else {
        ctx.fillStyle = '#db2777';
        ctx.shadowColor = '#ff007f';
        ctx.shadowBlur = 14;
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }
    }
    ctx.restore();
  });

  // رسم الأعداء
  if (lvl.enemies) {
    lvl.enemies.forEach(en => {
      if (!en.alive) return;
      ctx.save();
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 15;
      ctx.fillRect(en.x, en.y, en.w, en.h);
      ctx.fillStyle = '#fff';
      const eyeX = (en.dir === 1) ? en.x + en.w - 7 : en.x + 3;
      ctx.fillRect(eyeX, en.y + 7, 5, 5);
      ctx.restore();
    });
  }

  // رسم الأفخاخ
  lvl.hazards.forEach(h => {
    if (h.d === 'BOTH' || h.d === sys.dimension) {
      ctx.save();
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 14;
      const count = Math.floor(h.w / 16);
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.moveTo(h.x + i * 16, h.y + h.h);
        ctx.lineTo(h.x + i * 16 + 8, h.y);
        ctx.lineTo(h.x + (i + 1) * 16, h.y + h.h);
        ctx.fill();
      }
      ctx.restore();
    }
  });

  // رسم الكريستالات
  lvl.shards.forEach(s => {
    if (!s.collected) {
      ctx.save();
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 18;
      const wave = Math.sin(performance.now() * 0.007) * 5;
      ctx.beginPath();
      ctx.arc(s.x, s.y + wave, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  // بوابة الخروج
  const ex = lvl.exit;
  const opened = sys.shards >= sys.totalShards;
  ctx.save();
  ctx.strokeStyle = opened ? '#10b981' : '#475569';
  ctx.lineWidth = 3.5;
  ctx.shadowColor = opened ? '#34d399' : 'transparent';
  ctx.shadowBlur = 20;
  ctx.strokeRect(ex.x, ex.y, 38, 62);
  if (opened) {
    ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
    ctx.fillRect(ex.x, ex.y, 38, 62);
  }
  ctx.restore();

  // أشباح الـ Dash
  hero.ghosts.forEach(g => {
    ctx.save();
    ctx.globalAlpha = g.alpha;
    ctx.fillStyle = g.color;
    ctx.fillRect(g.x, g.y, hero.w, hero.h);
    ctx.restore();
  });

  // الوشاح
  ctx.save();
  ctx.strokeStyle = (sys.dimension === 'REAL') ? '#00f0ff' : '#ff007f';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hero.scarf[0].x, hero.scarf[0].y);
  for (let i = 1; i < hero.scarf.length; i++) {
    ctx.lineTo(hero.scarf[i].x, hero.scarf[i].y);
  }
  ctx.stroke();
  ctx.restore();

  // رسم اللاعب والانضغاط الحركي
  ctx.save();
  ctx.translate(hero.x + hero.w / 2, hero.y + hero.h / 2);
  ctx.scale(hero.scaleX, hero.scaleY);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = (sys.dimension === 'REAL') ? '#00f0ff' : '#ff007f';
  ctx.shadowBlur = 16;
  ctx.fillRect(-hero.w / 2, -hero.h / 2, hero.w, hero.h);

  // النظارة
  ctx.fillStyle = (sys.dimension === 'REAL') ? '#00f0ff' : '#ff007f';
  const eyeX = (hero.facing === 1) ? 2 : -8;
  ctx.fillRect(eyeX, -hero.h / 2 + 8, 7, 5);
  ctx.restore();

  // الجزيئات
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const pt = fxParticles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life -= pt.decay;
    if (pt.life <= 0) {
      fxParticles.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 3.5, 3.5);
    ctx.restore();
  }

  // الإضاءة الديناميكية
  const grad = ctx.createRadialGradient(
    hero.x + hero.w/2, hero.y + hero.h/2, 20,
    hero.x + hero.w/2, hero.y + hero.h/2, 280
  );
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(2, 3, 6, 0.45)');
  ctx.fillStyle = grad;
  ctx.fillRect(cam.x, cam.y, W, H);

  // وميض الـ Dash السينمائي (Impact Flash)
  if (sys.flash > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${sys.flash})`;
    ctx.fillRect(cam.x, cam.y, W, H);
    sys.flash -= 0.05;
  }

  ctx.restore();
}

function drawGrid(col, step, maxW, maxH) {
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1;
  for (let x = 0; x < maxW; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, maxH);
    ctx.stroke();
  }
  for (let y = 0; y < maxH; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(maxW, y);
    ctx.stroke();
  }
  ctx.restore();
}

// ==========================================
// 8. الحلقة الرئيسية ونظام الرتب العالمي
// ==========================================
function engineLoop() {
  if (sys.running) {
    updatePhysics();
  }
  render();
  requestAnimationFrame(engineLoop);
}

function calculateRank(totalTimeMs, deaths) {
  const seconds = totalTimeMs / 1000;
  if (deaths === 0 && seconds < 60) return { rank: 'S+', title: 'أسطورة السايبر المطلقة!' };
  if (deaths <= 3 && seconds < 90) return { rank: 'S', title: 'خبير الأبعاد الخارق' };
  if (deaths <= 8 && seconds < 130) return { rank: 'A', title: 'عدّاء محترف' };
  if (deaths <= 15) return { rank: 'B', title: 'مقاتل صامد' };
  return { rank: 'C', title: 'ناجٍ بصعوبة' };
}

function winGame() {
  sys.running = false;
  const elapsed = performance.now() - sys.timeStart;
  const m = String(Math.floor(elapsed / 60000)).padStart(2, '0');
  const s = String(Math.floor((elapsed % 60000) / 1000)).padStart(2, '0');
  const ms = String(Math.floor((elapsed % 1000) / 10)).padStart(2, '0');

  const rankResult = calculateRank(elapsed, sys.deaths);

  document.getElementById('rank-box').innerHTML = `<div class="rank-badge">${rankResult.rank}</div>`;
  document.getElementById('m-title').innerText = rankResult.title;
  document.getElementById('m-desc').innerText = `الوقت الكلي: ${m}:${s}.${ms}\nعدد الوفيات: ${sys.deaths}\nالتقييم التنافسي: رتبة ${rankResult.rank}`;
  document.getElementById('m-action').innerText = "إعادة التحدي للرتبة S+";
  document.getElementById('menu-overlay').classList.remove('hidden');
}

function launch() {
  bootAudio();
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
  document.getElementById('menu-overlay').classList.add('hidden');
  document.getElementById('rank-box').innerHTML = '';
  sys.deaths = 0;
  startLevel(0);
  sys.timeStart = performance.now();
  sys.running = true;
}

const actionBtn = document.getElementById('m-action');
