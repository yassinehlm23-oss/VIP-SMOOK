<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shadow of the Glitch</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 540px;
      aspect-ratio: 16 / 9;
      background-color: #0b0c10;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
    }
    #ui-layer {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 5px #000;
      z-index: 10;
    }
    .badge {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    #touch-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      height: 120px;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      pointer-events: none;
      z-index: 20;
    }
    .dpad, .action-pad {
      display: flex;
      gap: 15px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.4);
    }
    .btn-shift {
      background: rgba(255, 0, 128, 0.35);
      border-color: #ff007f;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }
    .btn-jump {
      background: rgba(0, 240, 255, 0.35);
      border-color: #00f0ff;
    }
    #overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 10, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 100;
    }
    #overlay-screen.hidden {
      display: none !important;
    }
    #overlay-screen h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #00f0ff;
      text-shadow: 0 0 15px #00f0ff;
      text-align: center;
    }
    #overlay-screen p {
      font-size: 15px;
      margin-bottom: 25px;
      color: #cbd5e1;
      text-align: center;
      max-width: 85%;
      line-height: 1.6;
    }
    #start-btn {
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      color: #050508;
      background: #00f0ff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <div id="ui-layer">
    <div class="badge" id="level-display">المرحلة: 1</div>
    <div class="badge" id="mode-display">الوضع: العالم الواقعي</div>
    <div class="badge" id="timer-display">الوقت: 00:00</div>
  </div>

  <div id="touch-controls">
    <div class="dpad">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="action-pad">
      <div class="btn btn-shift" id="btn-shift">SHIFT</div>
      <div class="btn btn-jump" id="btn-jump">▲</div>
    </div>
  </div>

  <div id="overlay-screen">
    <h1 id="screen-title">SHADOW OF THE GLITCH</h1>
    <p id="screen-desc">بدّل بين بُعد الواقع وبُعد السايبر لتجاوز العوائق والوصول للبوابة قبل نفاد الوقت.</p>
    <button id="start-btn">ابدأ اللعب</button>
  </div>
</div>

<script>
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;

    if (type === 'jump') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(420, t + 0.12);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.start(t);
      osc.stop(t + 0.12);
    } else if (type === 'shift') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(650, t);
      osc.frequency.exponentialRampToValueAtTime(130, t + 0.18);
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
      osc.start(t);
      osc.stop(t + 0.18);
    } else if (type === 'item') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(480, t);
      osc.frequency.setValueAtTime(960, t + 0.08);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
      osc.start(t);
      osc.stop(t + 0.22);
    } else if (type === 'death') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      osc.start(t);
      osc.stop(t + 0.25);
    }
  } catch(e){}
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;

const state = {
  currentLevel: 0,
  dimension: 'REAL',
  shake: 0,
  timeStart: 0,
  isPlaying: false,
  shardsCollected: 0,
  totalShards: 0
};

const levels = [
  {
    spawn: { x: 60, y: 390 },
    exit: { x: 870, y: 390 },
    platforms: [
      { x: 0, y: 470, w: 960, h: 70, d: 'BOTH' },
      { x: 200, y: 380, w: 120, h: 20, d: 'REAL' },
      { x: 380, y: 300, w: 140, h: 20, d: 'GLITCH' },
      { x: 580, y: 230, w: 120, h: 20, d: 'REAL' },
      { x: 730, y: 330, w: 120, h: 20, d: 'GLITCH' }
    ],
    hazards: [
      { x: 340, y: 450, w: 80, h: 20, d: 'REAL' },
      { x: 540, y: 450, w: 100, h: 20, d: 'GLITCH' }
    ],
    shards: [
      { x: 450, y: 250, collected: false },
      { x: 640, y: 180, collected: false }
    ]
  },
  {
    spawn: { x: 50, y: 390 },
    exit: { x: 890, y: 110 },
    platforms: [
      { x: 0, y: 470, w: 250, h: 70, d: 'BOTH' },
      { x: 310, y: 410, w: 100, h: 20, d: 'GLITCH' },
      { x: 470, y: 330, w: 120, h: 20, d: 'REAL' },
      { x: 310, y: 250, w: 100, h: 20, d: 'GLITCH' },
      { x: 490, y: 180, w: 140, h: 20, d: 'REAL' },
      { x: 710, y: 160, w: 250, h: 20, d: 'BOTH' }
    ],
    hazards: [
      { x: 250, y: 510, w: 710, h: 30, d: 'BOTH' },
      { x: 480, y: 310, w: 30, h: 20, d: 'REAL' }
    ],
    shards: [
      { x: 350, y: 360, collected: false },
      { x: 540, y: 130, collected: false }
    ]
  },
  {
    spawn: { x: 50, y: 110 },
    exit: { x: 870, y: 430 },
    platforms: [
      { x: 20, y: 170, w: 120, h: 20, d: 'BOTH' },
      { x: 190, y: 210, w: 90, h: 20, d: 'REAL' },
      { x: 330, y: 250, w: 90, h: 20, d: 'GLITCH' },
      { x: 470, y: 290, w: 90, h: 20, d: 'REAL' },
      { x: 610, y: 330, w: 90, h: 20, d: 'GLITCH' },
      { x: 750, y: 470, w: 210, h: 70, d: 'BOTH' },
      { x: 0, y: 510, w: 960, h: 30, d: 'GLITCH' }
    ],
    hazards: [
      { x: 210, y: 190, w: 30, h: 20, d: 'REAL' },
      { x: 490, y: 270, w: 30, h: 20, d: 'REAL' },
      { x: 0, y: 490, w: 750, h: 50, d: 'BOTH' }
    ],
    shards: [
      { x: 360, y: 200, collected: false },
      { x: 640, y: 280, collected: false }
    ]
  }
];

const player = {
  x: 60,
  y: 350,
  w: 24,
  h: 36,
  vx: 0,
  vy: 0,
  speed: 4.8,
  jumpPower: -11.5,
  isGrounded: false,
  facing: 1
};

let particles = [];
function addParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 1,
      decay: Math.random() * 0.04 + 0.02,
      color
    });
  }
}

const keys = { left: false, right: false, up: false };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
    if (!keys.up && player.isGrounded) jump();
    keys.up = true;
  }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') {
    toggleDimension();
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
});

function bindControl(id, onStart, onEnd) {
  const el = document.getElementById(id);
  const start = (e) => {
    e.preventDefault();
    initAudio();
    onStart();
  };
  const end = (e) => {
    e.preventDefault();
    if (onEnd) onEnd();
  };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
}

bindControl('btn-left', () => keys.left = true, () => keys.left = false);
bindControl('btn-right', () => keys.right = true, () => keys.right = false);
bindControl('btn-jump', () => { if (player.isGrounded) jump(); }, null);
bindControl('btn-shift', () => toggleDimension(), null);

function jump() {
  player.vy = player.jumpPower;
  player.isGrounded = false;
  playSound('jump');
  addParticles(player.x + player.w/2, player.y + player.h, '#fff', 6);
}

function toggleDimension() {
  if (!state.isPlaying) return;
  state.dimension = state.dimension === 'REAL' ? 'GLITCH' : 'REAL';
  state.shake = 8;
  playSound('shift');
  addParticles(player.x + player.w/2, player.y + player.h/2, state.dimension === 'REAL' ? '#00f0ff' : '#ff007f', 16);
  const modeEl = document.getElementById('mode-display');
  modeEl.innerText = state.dimension === 'REAL' ? 'الوضع: العالم الواقعي' : 'الوضع: بُعد الجليتش';
  modeEl.style.color = state.dimension === 'REAL' ? '#00f0ff' : '#ff007f';
}

function loadLevel(idx) {
  state.currentLevel = idx;
  const lvl = levels[idx];
  player.x = lvl.spawn.x;
  player.y = lvl.spawn.y;
  player.vx = 0;
  player.vy = 0;
  state.dimension = 'REAL';
  state.shardsCollected = 0;
  state.totalShards = lvl.shards.length;
  lvl.shards.forEach(s => s.collected = false);

  document.getElementById('level-display').innerText = `المرحلة: ${idx + 1} / ${levels.length}`;
  const modeEl = document.getElementById('mode-display');
  modeEl.innerText = 'الوضع: العالم الواقعي';
  modeEl.style.color = '#00f0ff';
}

function killPlayer() {
  playSound('death');
  state.shake = 12;
  addParticles(player.x + player.w/2, player.y + player.h/2, '#ff3344', 20);
  const lvl = levels[state.currentLevel];
  player.x = lvl.spawn.x;
  player.y = lvl.spawn.y;
  player.vx = 0;
  player.vy = 0;
}

function updatePhysics() {
  if (keys.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else if (keys.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else {
    player.vx *= 0.72;
  }

  player.vy += 0.55;
  if (player.vy > 12) player.vy = 12;

  player.x += player.vx;
  const currentLvl = levels[state.currentLevel];

  currentLvl.platforms.forEach(p => {
    if (p.d === 'BOTH' || p.d === state.dimension) {
      if (checkCollide(player, p)) {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  });

  player.y += player.vy;
  player.isGrounded = false;

  currentLvl.platforms.forEach(p => {
    if (p.d === 'BOTH' || p.d === state.dimension) {
      if (checkCollide(player, p)) {
        if (player.vy > 0) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.isGrounded = true;
        } else if (player.vy < 0) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }
  });

  currentLvl.hazards.forEach(h => {
    if (h.d === 'BOTH' || h.d === state.dimension) {
      if (checkCollide(player, h)) killPlayer();
    }
  });

  if (player.y > H + 40) killPlayer();

  currentLvl.shards.forEach(s => {
    if (!s.collected && checkCollide(player, { x: s.x - 12, y: s.y - 12, w: 24, h: 24 })) {
      s.collected = true;
      state.shardsCollected++;
      playSound('item');
      addParticles(s.x, s.y, '#f59e0b', 12);
    }
  });

  const ex = currentLvl.exit;
  if (checkCollide(player, { x: ex.x, y: ex.y, w: 30, h: 50 })) {
    if (state.shardsCollected >= state.totalShards) {
      if (state.currentLevel + 1 < levels.length) {
        loadLevel(state.currentLevel + 1);
      } else {
        finishGame();
      }
    }
  }

  if (state.isPlaying) {
    const diff = Math.floor((performance.now() - state.timeStart) / 1000);
    const m = String(Math.floor(diff / 60)).padStart(2, '0');
    const s = String(diff % 60).padStart(2, '0');
    document.getElementById('timer-display').innerText = `الوقت: ${m}:${s}`;
  }
}

function checkCollide(r1, r2) {
  return r1.x < r2.x + r2.w &&
         r1.x + r1.w > r2.x &&
         r1.y < r2.y + r2.h &&
         r1.y + r1.h > r2.y;
}

function draw() {
  ctx.save();

  if (state.shake > 0) {
    ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    state.shake *= 0.86;
    if (state.shake < 0.2) state.shake = 0;
  }

  if (state.dimension === 'REAL') {
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(0, 0, W, H);
    drawGrid('#161f30', 40);
  } else {
    ctx.fillStyle = '#120517';
    ctx.fillRect(0, 0, W, H);
    drawGrid('#38093d', 40);
  }

  const lvl = levels[state.currentLevel];

  lvl.platforms.forEach(p => {
    const isCurrent = (p.d === 'BOTH' || p.d === state.dimension);
    ctx.save();
    if (!isCurrent) {
      ctx.globalAlpha = 0.15;
      ctx.strokeStyle = '#fff';
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    } else {
      if (p.d === 'BOTH') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#64748b';
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      } else if (p.d === 'REAL') {
        ctx.fillStyle = '#0284c7';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(p.x, p.y, p.w, p.h);
      } else {
        ctx.fillStyle = '#db2777';
        ctx.shadowColor = '#ff007f';
        ctx.shadowBlur = 12;
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }
    }
    ctx.restore();
  });

  lvl.hazards.forEach(h => {
    if (h.d === 'BOTH' || h.d === state.dimension) {
      ctx.save();
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      const count = Math.floor(h.w / 15);
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.moveTo(h.x + i * 15, h.y + h.h);
        ctx.lineTo(h.x + i * 15 + 7.5, h.y);
        ctx.lineTo(h.x + (i + 1) * 15, h.y + h.h);
        ctx.fill();
      }
      ctx.restore();
    }
  });

  lvl.shards.forEach(s => {
    if (!s.collected) {
      ctx.save();
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 14;
      const bob = Math.sin(performance.now() * 0.006) * 4;
      ctx.beginPath();
      ctx.arc(s.x, s.y + bob, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  const ex = lvl.exit;
  const isUnlocked = state.shardsCollected >= state.totalShards;
  ctx.save();
  ctx.strokeStyle = isUnlocked ? '#10b981' : '#64748b';
  ctx.lineWidth = 3;
  ctx.shadowColor = isUnlocked ? '#34d399' : 'transparent';
  ctx.shadowBlur = 15;
  ctx.strokeRect(ex.x, ex.y, 30, 50);
  if (isUnlocked) {
    ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
    ctx.fillRect(ex.x, ex.y, 30, 50);
  }
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = state.dimension === 'REAL' ? '#00f0ff' : '#ff007f';
  ctx.shadowBlur = 12;
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = state.dimension === 'REAL' ? '#00f0ff' : '#ff007f';
  const eyeOffset = player.facing === 1 ? 14 : 4;
  ctx.fillRect(player.x + eyeOffset, player.y + 8, 6, 4);
  ctx.restore();

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life -= pt.decay;
    if (pt.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 3, 3);
    ctx.restore();
  }

  ctx.restore();
}

function drawGrid(color, size) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += size) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += size) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();
}

function gameLoop() {
  if (state.isPlaying) {
    updatePhysics();
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function finishGame() {
  state.isPlaying = false;
  const timeStr = document.getElementById('timer-display').innerText;
  document.getElementById('screen-title').innerText = "أحسنت! أكملت اللعبة";
  document.getElementById('screen-desc').innerText = `نجحت في الهروب من الخلل الرقمي وإنهاء جميع الغرف.\n${timeStr}`;
  document.getElementById('start-btn').innerText = "إعادة التحدي";
  document.getElementById('overlay-screen').classList.remove('hidden');
}

function startGame() {
  initAudio();
  document.getElementById('overlay-screen').classList.add('hidden');
  loadLevel(0);
  state.timeStart = performance.now();
  state.isPlaying = true;
}

const startBtn = document.getElementById('start-btn');
startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startGame();
}, { passive: false });

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
